<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OJK Crypto Reporting</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<!-- Header -->
<header>
    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand" href="{{ url_for('main.index') }}">
            OJK Crypto Reporting
        </a>
    </nav>
</header>

<div class="wrapper d-flex justify-content-center align-items-center">
    <!-- Main Content -->
    <main id="content" class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <form method="POST" action="{{ url_for('auth.login') }}">
                                {{ form.hidden_tag() }}
                                <div class="form-group">
                                    <label for="username"><i class="fas fa-user mr-2"></i>Username</label>
                                    {{ form.username(class="form-control", id="username") }}
                                </div>
                                <div class="form-group">
                                    <label for="password"><i class="fas fa-lock mr-2"></i>Password</label>
                                    {{ form.password(class="form-control", id="password") }}
                                </div>
                                <div class="form-group form-check">
                                    {{ form.remember_me(class="form-check-input", id="remember_me") }}
                                    <label class="form-check-label" for="remember_me">
                                        Remember Me
                                    </label>
                                </div>
                                <button type="submit" class="btn btn-primary btn-block">
                                    <i class="fas fa-sign-in-alt mr-2"></i>Login
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Footer -->
<footer>
    <div class="container">
        <span>&copy; 2023 MyApp. All rights reserved.</span>
        <span class="float-right">Version 1.0.0</span>
    </div>
</footer>

<script src="{{ url_for('static', filename='js/jquery.slim.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/popper.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
</body>
</html>
